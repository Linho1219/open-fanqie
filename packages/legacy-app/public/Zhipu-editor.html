<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>乐智简谱编辑器</title>
    <link href="/Public/zhipuStyle/default/main.css" rel="stylesheet" type="text/css" />
    <script src="/Public/js/jquery.min.js"></script>
    <script src="/Zhipu-jsCode-editor-y.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #333;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <textarea
      id="editor_text"
      class="editor_common editor_text"
      onblur="editdorOnblur()"
      onClick="editdorClick();"
      onscroll="setScroll()"
      onkeydown="return editdorKeydown()"
      onkeyup="editdorKeyup()"
    ></textarea>
    <div
      id="editor_div"
      class="editor_common editor_div"
      onclick="
        alert('很抱歉，您当前使用的浏览器暂不支持脚本加亮。\n脚本加亮功能将自动关闭。')
        $(this).hide()
      "
    ></div>
  </body>
</html>
